[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baqueano"
version = "0.1.0"
description = "GRC-oriented security auditor for MCP servers and AI agent tooling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Renzo Di Guglielmo" }]
keywords = ["mcp", "model-context-protocol", "security", "grc", "owasp", "iso27001", "ai-agents"]
dependencies = []

[project.urls]
Homepage = "https://github.com/Renzodigu/baqueano"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
baqueano = "baqueano.cli:main"

[tool.setuptools.packages.find]
include = ["baqueano*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
